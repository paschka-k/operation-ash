<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Операция «Пепел»</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161616'/%3E%3Cpath d='M16 5l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 13h8z' fill='%23e8892b'/%3E%3C/svg%3E">
  <style>
:root {
  --accent: #e8892b;
  --accent-2: #ffb95e;
  --danger: #e5412f;
  --ink: #f2efe9;
  --muted: #a9a49b;
  --panel: rgba(12, 13, 15, 0.82);
  --font: 'Bahnschrift', 'Segoe UI Semibold', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
}

html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); color: var(--ink); user-select: none; -webkit-user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: crosshair; }
#ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.hidden { display: none !important; }

/* ------------------------------------------------------------ HUD */
.hud { position: absolute; inset: 0; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.5); }
.hud.behind { opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.hud.lowhp::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 160px 40px rgba(180, 10, 10, 0.5); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

.wavebox { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); text-align: center; letter-spacing: 0.14em; }
.wave-title { font-size: 22px; font-weight: 700; color: var(--ink); }
.wave-sub { font-size: 15px; color: var(--accent-2); margin-top: 2px; letter-spacing: 0.1em; }
.wave-break { font-size: 14px; color: var(--muted); margin-top: 4px; min-height: 16px; }

.scorebox { position: absolute; top: 22px; right: 28px; text-align: right; }
.score-label { font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
.score-val { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.fps { font-size: 12px; color: var(--muted); margin-top: 4px; }

.killfeed { position: absolute; top: 96px; right: 28px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.feed-line { display: flex; gap: 12px; align-items: baseline; padding: 4px 10px; background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.55)); border-right: 3px solid var(--accent); animation: feedin 0.25s ease-out, feedout 0.5s ease-in 3.7s forwards; font-size: 15px; letter-spacing: 0.04em; }
.feed-line.head { border-right-color: var(--danger); }
.feed-name { color: var(--ink); }
.feed-pts { color: var(--accent-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.feed-streak { color: var(--danger); font-size: 12px; text-transform: uppercase; }
@keyframes feedin { from { transform: translateX(30px); opacity: 0; } }
@keyframes feedout { to { opacity: 0; } }

.radar { position: absolute; left: 26px; top: 22px; width: 150px; height: 150px; }

.crosshair { --gap: 8px; position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.crosshair i { position: absolute; background: rgba(255, 255, 255, 0.92); box-shadow: 0 0 2px rgba(0, 0, 0, 0.9); }
.crosshair .t { width: 2px; height: 9px; left: -1px; top: calc(-9px - var(--gap)); }
.crosshair .b { width: 2px; height: 9px; left: -1px; top: var(--gap); }
.crosshair .l { height: 2px; width: 9px; top: -1px; left: calc(-9px - var(--gap)); }
.crosshair .r { height: 2px; width: 9px; top: -1px; left: var(--gap); }
.crosshair .dot { width: 2px; height: 2px; left: -1px; top: -1px; opacity: 0.8; }

.hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
.hitmarker i { position: absolute; width: 2px; height: 11px; background: #fff; box-shadow: 0 0 3px #000; left: -1px; top: -1px; transform-origin: 1px 1px; }
.hitmarker i:nth-child(1) { transform: rotate(45deg) translateY(7px); }
.hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(7px); }
.hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(7px); }
.hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(7px); }
.hitmarker.on { animation: hit 0.28s ease-out; }
.hitmarker.kill i { background: var(--danger); height: 14px; }
.hitmarker.head i { background: var(--accent-2); }
.hitmarker.prop i { background: #ccc; height: 8px; }
@keyframes hit { 0% { opacity: 1; transform: scale(1.35); } 100% { opacity: 0; transform: scale(1); } }

.dmg-layer { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.dmg { position: absolute; left: -110px; top: -190px; width: 220px; height: 70px; transform-origin: 110px 190px; background: radial-gradient(ellipse at 50% 100%, rgba(235, 30, 20, 0.95), rgba(235, 30, 20, 0) 70%); animation: dmgfade 1.2s ease-out forwards; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); border-radius: 50% 50% 0 0; filter: blur(2px); }
@keyframes dmgfade { to { opacity: 0; } }

.banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; opacity: 0; --dur: 2.5s; }
.banner.on { animation: banner var(--dur) ease-out forwards; }
.banner-t { font-size: 72px; font-weight: 800; letter-spacing: 0.28em; color: var(--ink); text-indent: 0.28em; }
.banner-s { font-size: 20px; letter-spacing: 0.2em; color: var(--accent-2); margin-top: 6px; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.2); letter-spacing: 0.5em; } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

.toast { position: absolute; left: 50%; bottom: 28%; transform: translateX(-50%); font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-2); opacity: 0; }
.toast.on { animation: toast 1.6s ease-out forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12% { opacity: 1; transform: translate(-50%, 0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }

.status { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 36px 28px; box-sizing: border-box; }
.health-label { font-size: 12px; letter-spacing: 0.24em; color: var(--muted); }
.health-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.health-bar { width: 240px; height: 10px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.25); transform: skewX(-18deg); }
.health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #d8d3c8, #fff); transition: width 0.12s linear; }
.health-fill.low { background: linear-gradient(90deg, #b3201a, #ff5a46); }
.health-num { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 70px; }

.ammo { text-align: right; position: relative; }
.ammo-name { font-size: 14px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
.ammo-row { margin-top: 2px; }
.ammo-mag { font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ammo-mag.low { color: var(--accent-2); }
.ammo-mag.empty { color: var(--danger); }
.ammo-res { font-size: 26px; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.reload { display: none; margin-top: 6px; }
.reload.on { display: block; }
.reload-bar { height: 4px; background: rgba(255, 255, 255, 0.18); }
.reload-fill { height: 100%; width: 0; background: var(--accent); }
.reload-txt { font-size: 12px; letter-spacing: 0.2em; color: var(--accent-2); margin-top: 4px; text-transform: uppercase; }
.ammo-warn { font-size: 13px; letter-spacing: 0.18em; color: var(--danger); text-transform: uppercase; min-height: 16px; margin-top: 4px; }

/* -------------------------------------------------------- screens */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: radial-gradient(ellipse at 30% 50%, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.72)); animation: fadein 0.35s ease-out; }
.screen.solid { background: #0a0b0c; }
@keyframes fadein { from { opacity: 0; } }
.panel { width: min(460px, 86vw); display: flex; flex-direction: column; gap: 12px; padding: 36px 40px; background: var(--panel); border-left: 4px solid var(--accent); backdrop-filter: blur(6px); }
.panel.menu { margin-right: auto; margin-left: 8vw; }
.logo { font-size: 44px; font-weight: 800; letter-spacing: 0.12em; line-height: 1.05; color: var(--ink); }
.logo.small { font-size: 30px; }
.tagline { color: var(--muted); letter-spacing: 0.08em; margin-bottom: 14px; }
.hint { margin-top: 14px; font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
.btn { font-family: var(--font); font-size: 19px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.18); padding: 13px 18px; text-align: left; cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.12s; }
.btn:hover, .btn:focus-visible { background: rgba(232, 137, 43, 0.22); border-color: var(--accent); transform: translateX(4px); outline: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #151311; font-weight: 700; }
.btn.primary:hover { background: var(--accent-2); }

.progress { height: 6px; background: rgba(255, 255, 255, 0.12); margin-top: 18px; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.load-label { color: var(--muted); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; }

.settings { width: min(560px, 90vw); }
.row { display: grid; grid-template-columns: 1fr 190px 52px; gap: 12px; align-items: center; font-size: 15px; letter-spacing: 0.04em; }
.row.chk { grid-template-columns: 22px 1fr; }
.row select { grid-column: 2 / span 2; }
.row input[type=range] { accent-color: var(--accent); width: 100%; }
.row output { text-align: right; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.row select { font-family: var(--font); font-size: 15px; background: #1a1b1d; color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; }
.row input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
.settings .btn { margin-top: 10px; }

.ctl-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.ctl { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 5px 0; font-size: 16px; letter-spacing: 0.05em; }
.ctl-key { color: var(--accent-2); }

.result { width: min(480px, 90vw); }
.panel.result { margin: 0 auto; }
.result.bad { border-left-color: var(--danger); }
.result.good { border-left-color: #6fcf6f; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; margin: 6px 0 14px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 4px 0; letter-spacing: 0.05em; }
.stats span { color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
  .banner-t { font-size: 40px; }
  .radar { width: 110px; height: 110px; }
  .panel.menu { margin: 0 auto; }
}

/* ---- crosshair on target, enemy health bar, start-screen controls */
.crosshair.onenemy i { background: #ff3a2a; box-shadow: 0 0 4px rgba(255, 40, 20, 0.8); }
.enemybar { position: absolute; left: 50%; top: calc(50% - 90px); transform: translate(-50%, -100%); width: 150px; text-align: center; opacity: 0; transition: opacity 0.15s; }
.enemybar.on { opacity: 1; }
.eb-name { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); margin-bottom: 3px; }
.eb-track { height: 5px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.3); }
.eb-fill { height: 100%; width: 100%; background: #e5412f; transition: width 0.1s linear; }
.mini-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 22px; margin-top: 10px; font-size: 13px; letter-spacing: 0.04em; }
.mini-ctl div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 2px 0; color: var(--muted); }
.mini-ctl b { color: var(--accent-2); font-weight: 600; }

</style>
